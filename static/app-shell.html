<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FEWS Web Nuevo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="loadingBar" class="loading-bar"></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-kicker">IDEAM / FEWS</div>
          <h1>FEWS Web Nuevo</h1>
          <p id="brandDescription"></p>
        </div>
        <nav class="nav">
          <button class="nav-link active" data-view="overview" id="navOverview"></button>
          <button class="nav-link" data-view="purpose" id="navPurpose"></button>
          <button class="nav-link" data-view="stations" id="navStations"></button>
          <button class="nav-link" data-view="alerts" id="navAlerts"></button>
          <button class="nav-link" data-view="map" id="navMap"></button>
          <button class="nav-link" data-view="reservoirs" id="navReservoirs"></button>
          <button class="nav-link" data-view="sources" id="navSources"></button>
        </nav>
        <div class="sidebar-footer">
          <label class="control-label" id="langLabel"></label>
          <div class="language-toggle">
            <button type="button" class="lang-btn active" data-lang="es">ES</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
          <div class="theme-toggle">
            <button type="button" class="theme-btn" data-theme-id="light" id="themeLight">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button type="button" class="theme-btn" data-theme-id="dark" id="themeDark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <div class="eyebrow" id="topbarEyebrow"></div>
            <h2 id="viewTitle"></h2>
          </div>
          <div class="topbar-meta">
            <div class="meta-card">
              <span id="lastUpdateLabel"></span>
              <strong id="lastUpdateValue">-</strong>
            </div>
            <div class="meta-card">
              <span id="sourceHealthLabel"></span>
              <strong id="sourceHealthValue">-</strong>
            </div>
          </div>
        </header>

        <section class="view active" id="view-overview">
          <div class="hero-panel">
            <div>
              <div class="eyebrow" id="overviewHeroEyebrow"></div>
              <h3 id="overviewHeroTitle"></h3>
            </div>
            <div class="legend" id="severityLegend"></div>
          </div>
          <div class="stats-grid" id="overviewStats">
            <article class="stat-card skeleton"></article>
            <article class="stat-card skeleton"></article>
            <article class="stat-card skeleton"></article>
            <article class="stat-card skeleton"></article>
          </div>
          <div class="content-grid two-columns">
            <section class="panel">
              <div class="panel-head">
                <h3 id="overviewHighlightedTitle"></h3>
              </div>
              <div id="highlightedStations" class="list-stack">
                <div class="list-item skeleton" style="height:86px;"></div>
                <div class="list-item skeleton" style="height:86px;"></div>
              </div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h3 id="overviewAlertsTitle"></h3>
              </div>
              <div id="overviewAlerts" class="list-stack">
                <div class="list-item skeleton" style="height:86px;"></div>
                <div class="list-item skeleton" style="height:86px;"></div>
              </div>
            </section>
          </div>
        </section>

        <section class="view" id="view-purpose">
          <div class="content-grid two-columns">
            <section class="panel purpose-copy">
              <div class="panel-head">
                <h3 id="purposeIntroTitle"></h3>
              </div>
              <p id="purposeIntroBody"></p>
            </section>
            <section class="panel purpose-copy">
              <div class="panel-head">
                <h3 id="purposeGoalsTitle"></h3>
              </div>
              <ul id="purposeGoalsList"></ul>
            </section>
          </div>
          <section class="panel purpose-copy">
            <div class="panel-head">
              <h3 id="purposeHowTitle"></h3>
            </div>
            <ul id="purposeHowList"></ul>
          </section>
        </section>

        <section class="view" id="view-stations">
          <section class="panel">
            <div class="panel-head">
              <h3 id="stationFiltersTitle"></h3>
            </div>
            <div class="filters-grid">
              <div class="search-wrapper">
                <svg viewBox="0 0 24 24" class="search-icon"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input id="searchInput" type="search" />
              </div>
              <select id="statusFilter"></select>
              <select id="departmentFilter"></select>
            </div>
          </section>
          <div class="content-grid two-columns">
            <section class="panel">
              <div class="panel-head">
                <h3 id="stationsTableTitle"></h3>
                <span id="stationsCount"></span>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th id="colStation"></th>
                      <th id="colRiver"></th>
                      <th id="colLocation"></th>
                      <th id="colStatus"></th>
                    </tr>
                  </thead>
                  <tbody id="stationsTableBody"></tbody>
                </table>
              </div>
            </section>
            <section class="panel detail-panel">
              <div class="panel-head">
                <h3 id="stationDetailTitle"></h3>
              </div>
              <div id="stationDetailEmpty" class="empty-state"></div>
              <div id="stationDetail" class="detail-stack hidden"></div>
            </section>
          </div>
        </section>

        <section class="view" id="view-alerts">
          <section class="panel">
            <div class="panel-head">
              <h3 id="alertsTitle"></h3>
            </div>
            <div id="alertsList" class="list-stack">
              <div class="list-item skeleton" style="height:102px;"></div>
              <div class="list-item skeleton" style="height:102px;"></div>
              <div class="list-item skeleton" style="height:102px;"></div>
            </div>
          </section>
        </section>

        <section class="view" id="view-map">
          <section class="panel">
            <div class="panel-head">
              <h3 id="mapTitle"></h3>
            </div>
            <div class="map-workspace">
              <aside id="mapLayersPanel" class="map-layers-panel"></aside>
              <div class="map-controls glass-panel">
                <h4>Filtro de Estado</h4>
                <div class="filter-toggles">
                  <button class="filter-btn active" data-color="red" style="border-left-color: #ef4444;">Roja</button>
                  <button class="filter-btn active" data-color="orange" style="border-left-color: #f97316;">Naranja</button>
                  <button class="filter-btn active" data-color="yellow" style="border-left-color: #eab308;">Amarilla</button>
                  <button class="filter-btn active" data-color="normal" style="border-left-color: #10b981;">Normal</button>
                  <button class="filter-btn active" data-color="no_data" style="border-left-color: #94a3b8;">Sin Dato</button>
                </div>
              </div>
              <div id="mapCanvas" class="map-canvas"></div>
            </div>
          </section>
        </section>

        <section class="view" id="view-station-detail">
          <div class="content-grid two-columns">
            <section class="panel detail-panel" style="border-right: none;">
              <div class="panel-head">
                <h3 id="detailPageTitle">Detalle de Estación</h3>
              </div>
              <button id="btnBackToStations" class="lang-btn" style="margin-bottom: 16px; width: auto; padding: 6px 12px; background: #e0f2fe; color: #0284c7;">← Volver</button>
              <div id="stationDetailPageEmpty" class="empty-state">Seleccione una estación en el mapa o lista para ver los detalles.</div>
              <div id="stationDetailPageInfo" class="detail-stack hidden"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h3>Histórico y Pronóstico</h3>
              </div>
              <div style="position: relative; height: 440px; width: 100%;">
                <canvas id="stationChart"></canvas>
              </div>
            </section>
          </div>
        </section>

        <section class="view" id="view-reservoirs">
          <section class="panel">
            <div class="panel-head">
              <h3 id="reservoirsTitle"></h3>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th id="colReservoir"></th>
                    <th id="colUsefulVolume"></th>
                    <th id="colUsefulPct"></th>
                    <th id="colRainObs"></th>
                    <th id="colRainForecast"></th>
                  </tr>
                </thead>
                <tbody id="reservoirsTableBody"></tbody>
              </table>
            </div>
          </section>
        </section>

        <section class="view" id="view-sources">
          <section class="panel">
            <div class="panel-head">
              <h3 id="sourcesTitle"></h3>
            </div>
            <div id="sourcesList" class="list-stack">
              <div class="source-item skeleton" style="height:90px;"></div>
              <div class="source-item skeleton" style="height:90px;"></div>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/js/main.js?v=1775354000"></script>
  </body>
</html>
